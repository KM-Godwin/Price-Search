<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drug Prices Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.95;
            font-weight: 300;
        }

        .csv-upload-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
        }

        .upload-container {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 0.95em;
            min-height: 44px;
            user-select: none;
        }

        .file-input-label:hover {
            background: #764ba2;
        }

        .file-input-label:active {
            transform: scale(0.98);
        }

        .file-name {
            color: #666;
            font-weight: 500;
            padding: 12px 16px;
            background: #f5f5f5;
            border-radius: 8px;
            flex: 1;
            min-width: 200px;
        }

        .upload-info {
            background: #e8f5e9;
            padding: 12px 16px;
            border-radius: 8px;
            color: #2e7d32;
            font-size: 0.9em;
            border-left: 4px solid #4caf50;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .search-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            margin-bottom: 30px;
        }

        .search-input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        #searchInput {
            flex: 1;
            padding: 14px 20px;
            font-size: 1em;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: all 0.3s ease;
            outline: none;
            min-height: 44px;
        }

        #searchInput:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #searchInput::placeholder {
            color: #999;
        }

        .sort-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .sort-label {
            color: #666;
            font-weight: 500;
            font-size: 0.95em;
        }

        .sort-btn {
            padding: 10px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 0.95em;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sort-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .sort-btn:active {
            transform: scale(0.98);
        }

        .sort-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .results-section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .results-header {
            padding: 20px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .results-count {
            font-size: 1.1em;
        }

        .results-list {
            max-height: 600px;
            overflow-y: auto;
            border-top: 1px solid #f0f0f0;
        }

        .drug-item {
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s ease;
            cursor: pointer;
            gap: 15px;
        }

        .drug-item:hover {
            background-color: #f8f9ff;
        }

        .drug-item:last-child {
            border-bottom: none;
        }

        .drug-name {
            flex: 1;
            color: #333;
            font-weight: 500;
            word-break: break-word;
            min-width: 0;
        }

        .drug-price {
            color: #667eea;
            font-weight: 700;
            font-size: 1.15em;
            min-width: 90px;
            text-align: right;
            flex-shrink: 0;
        }

        .empty-state {
            padding: 60px 30px;
            text-align: center;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .empty-state-hint {
            font-size: 0.9em;
            color: #bbb;
        }

        .stats {
            padding: 12px 30px;
            background: #f8f9ff;
            color: #666;
            font-size: 0.9em;
            border-top: 1px solid #f0f0f0;
        }

        .price-list-info {
            padding: 10px 30px;
            background: #fff3e0;
            color: #e65100;
            font-size: 0.85em;
            border-top: 1px solid #ffe0b2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reset-btn {
            padding: 6px 12px;
            background: #e65100;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            transition: background 0.3s ease;
        }

        .reset-btn:hover {
            background: #bf360c;
        }

        .error-message {
            background: #ffebee;
            padding: 12px 16px;
            border-radius: 8px;
            color: #c62828;
            margin-top: 10px;
            border-left: 4px solid #f44336;
            display: none;
        }

        .success-message {
            background: #e8f5e9;
            padding: 12px 16px;
            border-radius: 8px;
            color: #2e7d32;
            margin-top: 10px;
            border-left: 4px solid #4caf50;
            display: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            header {
                margin-bottom: 25px;
            }

            h1 {
                font-size: 1.8em;
                margin-bottom: 5px;
            }

            .subtitle {
                font-size: 0.95em;
            }

            .csv-upload-section {
                padding: 16px;
                margin-bottom: 16px;
            }

            .csv-upload-section h3 {
                font-size: 0.95em;
            }

            .upload-container {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .file-input-label {
                width: 100%;
                justify-content: center;
                padding: 14px 16px;
                font-size: 0.9em;
            }

            .file-name {
                width: 100%;
                text-align: center;
                padding: 14px 16px;
                font-size: 0.9em;
            }

            .upload-info {
                margin-top: 10px;
                padding: 10px 12px;
                font-size: 0.8em;
            }

            .search-section {
                padding: 16px;
                margin-bottom: 20px;
            }

            .search-input-wrapper {
                flex-direction: column;
                margin-bottom: 16px;
                gap: 12px;
            }

            #searchInput {
                padding: 12px 16px;
                font-size: 1em;
            }

            .sort-controls {
                width: 100%;
                gap: 8px;
            }

            .sort-label {
                width: 100%;
                font-size: 0.9em;
                margin-bottom: 4px;
            }

            .sort-btn {
                flex: 1;
                min-width: 0;
                padding: 10px 12px;
                font-size: 0.85em;
            }

            .results-header {
                padding: 14px 16px;
                flex-direction: column;
                gap: 8px;
                text-align: center;
                font-size: 0.95em;
            }

            .results-list {
                max-height: 500px;
            }

            .drug-item {
                padding: 14px 16px;
                gap: 12px;
                min-height: 60px;
                justify-content: space-between;
                align-items: center;
            }

            .drug-name {
                font-size: 0.95em;
                line-height: 1.4;
                flex: 1;
            }

            .drug-price {
                font-size: 1.2em;
                font-weight: 700;
                color: #667eea;
                min-width: 80px;
            }

            .stats {
                padding: 12px 16px;
                font-size: 0.8em;
                line-height: 1.5;
            }

            .price-list-info {
                padding: 12px 16px;
                flex-direction: column;
                gap: 8px;
                text-align: center;
                font-size: 0.8em;
            }

            .reset-btn {
                padding: 8px 14px;
                font-size: 0.8em;
                width: 100%;
            }

            .empty-state-icon {
                font-size: 2.5em;
                margin-bottom: 12px;
            }

            .empty-state-text {
                font-size: 1em;
                margin-bottom: 6px;
            }

            .empty-state-hint {
                font-size: 0.85em;
            }
        }

        /* Extra optimization for very small phones (< 380px) */
        @media (max-width: 380px) {
            h1 {
                font-size: 1.5em;
            }

            .search-input-wrapper {
                gap: 8px;
            }

            .drug-item {
                padding: 12px 14px;
                min-height: 55px;
            }

            .drug-name {
                font-size: 0.9em;
            }

            .drug-price {
                font-size: 1.1em;
                min-width: 70px;
            }

            .sort-btn {
                padding: 8px 10px;
                font-size: 0.8em;
            }
        }

        .scrollbar-custom::-webkit-scrollbar {
            width: 8px;
        }

        .scrollbar-custom::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .scrollbar-custom::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        .scrollbar-custom::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💊 Drug Prices Search</h1>
            <p class="subtitle">Find medication prices instantly</p>
        </header>

        <div class="search-section">
            <div class="search-input-wrapper">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search drug names... (e.g., Paracetamol, Antibiotic)"
                    autocomplete="off"
                >
            </div>
            <div class="sort-controls">
                <span class="sort-label">Sort by:</span>
                <button class="sort-btn active" data-sort="name">Name (A-Z)</button>
                <button class="sort-btn" data-sort="price-asc">Price (Low to High)</button>
                <button class="sort-btn" data-sort="price-desc">Price (High to Low)</button>
            </div>
        </div>

        <div class="results-section">
            <div class="results-header">
                <span class="results-count">Showing <span id="resultCount">0</span> drugs</span>
                <span id="clearNotice" style="display: none; cursor: pointer; opacity: 0.8;">✕ Clear search</span>
            </div>
            <div class="results-list scrollbar-custom" id="resultsList"></div>
            <div class="stats" id="statsBar"></div>
            <div class="price-list-info" id="priceListInfo" style="display: none;">
                <span id="priceListDate"></span>
            </div>
        </div>
    </div>

    <script>
        // ==================== DATA MANAGEMENT ====================
        // Live prices are read from rptpricelist.csv in the same GitHub repository as this page.
        // To update prices, replace that file in the repository.
        const LIVE_CSV_URL = 'rptpricelist.csv';

        let drugsData = [];
        let currentSort = 'name';
        let filteredData = [];
        let currentPriceListSource = 'loading'; // 'loading' | 'live' | 'error'
        let currentPriceListDate = null;

        async function loadLivePrices() {
            currentPriceListSource = 'loading';
            updatePriceListInfo();
            resultsList.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading prices…</div></div>';

            try {
                const res = await fetch(LIVE_CSV_URL + '?v=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);

                const parsed = parseRptPricelistCSV(await res.text());
                if (parsed.length === 0) throw new Error('no drugs found in the price list');

                drugsData = parsed;
                currentPriceListSource = 'live';
                const lastModified = res.headers.get('Last-Modified');
                currentPriceListDate = lastModified ? new Date(lastModified).toLocaleString() : null;
            } catch (err) {
                console.error('Could not load live prices:', err);
                drugsData = [];
                currentPriceListSource = 'error';
            }

            applyFilters();
            updatePriceListInfo();
        }

        function applyFilters() {
            const query = searchInput.value.toLowerCase().trim();
            filteredData = query
                ? drugsData.filter(drug => drug.name.toLowerCase().includes(query))
                : [...drugsData];
            clearNotice.style.display = query ? 'inline' : 'none';
            sortData();
            displayResults(filteredData);
        }

        // ==================== CSV PARSING ====================
        function parseRptPricelistCSV(csvContent) {
            const lines = csvContent.split('\n');
            const drugs = [];
            const seen = new Set();

            for (const line of lines) {
                if (!line.trim()) continue;
                
                try {
                    // Parse CSV line handling quoted fields
                    const fields = [];
                    let currentField = '';
                    let inQuotes = false;

                    for (let i = 0; i < line.length; i++) {
                        const char = line[i];
                        const nextChar = line[i + 1];

                        if (char === '"') {
                            if (inQuotes && nextChar === '"') {
                                currentField += '"';
                                i++; // Skip next quote
                            } else {
                                inQuotes = !inQuotes;
                            }
                        } else if (char === ',' && !inQuotes) {
                            fields.push(currentField.trim().replace(/^"|"$/g, ''));
                            currentField = '';
                        } else {
                            currentField += char;
                        }
                    }
                    fields.push(currentField.trim().replace(/^"|"$/g, ''));

                    // Extract drug name (column 9) and price (column 10)
                    if (fields.length > 10) {
                        const drugName = fields[9]?.trim();
                        let priceStr = fields[10]?.trim();

                        if (drugName && priceStr && drugName.length > 0) {
                            // Remove commas from price (handle "1,986.00" format)
                            priceStr = priceStr.replace(/,/g, '').trim();
                            const price = parseInt(parseFloat(priceStr));

                            if (!isNaN(price)) {
                                // Create unique key to avoid duplicates
                                const key = `${drugName}|${price}`;
                                if (!seen.has(key)) {
                                    drugs.push({ name: drugName, price: price });
                                    seen.add(key);
                                }
                            }
                        }
                    }
                } catch (e) {
                    // Silently skip problematic lines
                }
            }

            return drugs;
        }

        // ==================== UI ELEMENTS ====================
        const searchInput = document.getElementById('searchInput');
        const resultsList = document.getElementById('resultsList');
        const resultCount = document.getElementById('resultCount');
        const clearNotice = document.getElementById('clearNotice');
        const statsBar = document.getElementById('statsBar');
        const sortBtns = document.querySelectorAll('.sort-btn');
        const priceListInfo = document.getElementById('priceListInfo');
        const priceListDate = document.getElementById('priceListDate');

        // ==================== EVENT LISTENERS ====================
        searchInput.addEventListener('input', handleSearch);
        sortBtns.forEach(btn => btn.addEventListener('click', handleSort));
        clearNotice.addEventListener('click', clearSearch);

        function handleSearch(e) {
            const query = e.target.value.toLowerCase().trim();
            
            if (query.length === 0) {
                filteredData = [...drugsData];
                clearNotice.style.display = 'none';
            } else {
                filteredData = drugsData.filter(drug =>
                    drug.name.toLowerCase().includes(query)
                );
                clearNotice.style.display = 'inline';
            }
            
            sortData();
            displayResults(filteredData);
        }

        function handleSort(e) {
            sortBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentSort = e.target.dataset.sort;
            sortData();
            displayResults(filteredData);
        }

        function clearSearch() {
            searchInput.value = '';
            searchInput.focus();
            filteredData = [...drugsData];
            clearNotice.style.display = 'none';
            sortData();
            displayResults(filteredData);
        }

        function updatePriceListInfo() {
            const messages = {
                loading: '⏳ Loading the latest price list…',
                live: '🟢 Live prices' + (currentPriceListDate ? ' · last updated ' + currentPriceListDate : ''),
                error: '⚠️ Could not load the latest price list. Check your connection and refresh the page.'
            };
            priceListDate.textContent = messages[currentPriceListSource] || '';
            priceListInfo.style.display = 'flex';
        }

        function sortData() {
            if (currentSort === 'name') {
                filteredData.sort((a, b) => a.name.localeCompare(b.name));
            } else if (currentSort === 'price-asc') {
                filteredData.sort((a, b) => a.price - b.price);
            } else if (currentSort === 'price-desc') {
                filteredData.sort((a, b) => b.price - a.price);
            }
        }

        function displayResults(results) {
            resultCount.textContent = results.length;

            if (results.length === 0) {
                resultsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <div class="empty-state-text">No drugs found</div>
                        <div class="empty-state-hint">Try a different search term</div>
                    </div>
                `;
                statsBar.innerHTML = '';
                return;
            }

            const totalPrice = results.reduce((sum, drug) => sum + drug.price, 0);
            const avgPrice = (totalPrice / results.length).toFixed(2);
            const minPrice = Math.min(...results.map(d => d.price));
            const maxPrice = Math.max(...results.map(d => d.price));

            resultsList.innerHTML = results
                .map(drug => `
                    <div class="drug-item">
                        <div class="drug-name">${escapeHtml(drug.name)}</div>
                        <div class="drug-price">KES ${drug.price.toLocaleString()}</div>
                    </div>
                `)
                .join('');

            statsBar.innerHTML = `
                Average: KES ${avgPrice} | 
                Min: KES ${minPrice.toLocaleString()} | 
                Max: KES ${maxPrice.toLocaleString()}
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        loadLivePrices();
        searchInput.focus();
    </script>
</body>
</html>
